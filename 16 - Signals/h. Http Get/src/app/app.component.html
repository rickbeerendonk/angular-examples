@if (todos.isLoading()) {
  <p>Loading...</p>
}
@if (todos.error()) {
  <p>Error loading todos</p>
}
<ul>
  @for (todo of todos.value() ?? []; track todo.id) {
    <li>{{ todo.completed }} - {{ todo.title }}</li>
  }
</ul>
